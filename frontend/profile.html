<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil Saya - EcoStore</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/neobrutalism.css">
  </head>
  <body class="bg-gray-100 min-h-screen">
    
    <header class="nb-navbar sticky top-0 z-50">
      <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center h-20">
        <a href="index.html" class="text-2xl font-black tracking-tight">ECO<span class="bg-yellow-300 px-2 border-4 border-black">STORE</span></a>
        <div class="flex gap-6 items-center">
          <a href="toko.html" class="nb-link uppercase font-black">Produk</a>
          <a href="keranjang.html" class="relative text-2xl font-black">
            🛒
            <span id="cart-count" class="absolute -top-2 -right-2 nb-badge nb-badge-pink text-xs h-6 w-6 flex items-center justify-center hidden">0</span>
          </a>
          <button onclick="logout()" class="nb-btn nb-btn-pink uppercase font-black">
            LOGOUT
          </button>
        </div>
      </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-16">
      <div class="grid md:grid-cols-3 gap-8">
        
        <!-- Sidebar Profil -->
        <div class="md:col-span-1">
          <div class="nb-card p-6 bg-white text-center">
            <div class="mb-6">
              <div class="text-5xl" id="user-avatar">👤</div>
              <h2 id="user-name" class="text-2xl font-black mt-4 uppercase">Loading...</h2>
              <p id="user-email" class="text-sm font-bold mt-1 uppercase">Loading...</p>
            </div>
            
            <div class="nb-divider pt-4">
              <button onclick="showTab('orders')" id="tab-orders" class="nb-btn nb-btn-yellow w-full text-sm mb-2 uppercase">
                🛍️ PESANAN SAYA
              </button>
              <button onclick="showTab('wishlist')" id="tab-wishlist" class="nb-btn nb-btn-white w-full text-sm mb-2 uppercase">
                ❤️ WISHLIST
              </button>
              <button onclick="showTab('profile')" id="tab-profile" class="nb-btn nb-btn-white w-full text-sm mb-2 uppercase">
                📝 EDIT PROFIL
              </button>
              <button onclick="showTab('ecopoints')" id="tab-ecopoints" class="nb-btn nb-btn-white w-full text-sm uppercase">
                🌱 ECO-POINTS
              </button>
            </div>
          </div>
        </div>

        <!-- Content Area -->
        <div class="md:col-span-2">
          
          <!-- Tab Pesanan -->
          <div id="content-orders" class="nb-card p-6 bg-white hidden">
            <h3 class="text-3xl font-black uppercase mb-6">Riwayat Pesanan</h3>
            <div id="orders-list" class="space-y-4">
              <p class="text-center font-bold py-8">Memuat pesanan...</p>
            </div>
          </div>

          <!-- Tab Edit Profil -->
          <div id="content-profile" class="nb-card p-6 bg-white hidden">
            <h3 class="text-3xl font-black uppercase mb-6">Edit Profil</h3>
            <form id="profile-form" class="space-y-4">
              <div>
                <label class="text-sm font-black uppercase mb-2 block tracking-wide">Nama Lengkap</label>
                <input type="text" id="edit-nama" class="nb-input w-full uppercase" required>
              </div>
              <div>
                <label class="text-sm font-black uppercase mb-2 block tracking-wide">Email</label>
                <input type="email" id="edit-email" class="nb-input w-full bg-gray-50 uppercase" disabled>
              </div>
              <div>
                <label class="text-sm font-black uppercase mb-2 block tracking-wide">Nomor Telepon</label>
                <input type="tel" id="edit-telepon" class="nb-input w-full uppercase">
              </div>
              <div>
                <label class="text-sm font-black uppercase mb-2 block tracking-wide">Alamat</label>
                <textarea id="edit-alamat" rows="3" class="nb-input w-full uppercase"></textarea>
              </div>
              <div class="grid grid-cols-2 gap-4">
                <div>
                  <label class="text-sm font-black uppercase mb-2 block tracking-wide">Kota</label>
                  <input type="text" id="edit-kota" class="nb-input w-full uppercase">
                </div>
                <div>
                  <label class="text-sm font-black uppercase mb-2 block tracking-wide">Provinsi</label>
                  <input type="text" id="edit-provinsi" class="nb-input w-full uppercase">
                </div>
              </div>
              <button type="submit" class="nb-btn nb-btn-yellow w-full uppercase font-black">
                SIMPAN PERUBAHAN
              </button>
            </form>
          </div>

          <!-- Tab Eco-Points -->
          <div id="content-ecopoints" class="nb-card p-6 bg-white hidden">
            <h3 class="text-3xl font-black uppercase mb-6">Eco-Points Saya</h3>
            <div class="text-center py-8">
              <div class="text-6xl mb-4 nb-animate-bounce" id="eco-tree-emoji">🌱</div>
              <p class="text-2xl font-black uppercase mb-2" id="eco-level-text">LEVEL 1: TUNAS HARAPAN</p>
              <div class="max-w-md mx-auto mb-4">
                <div class="w-full bg-black h-4 border-4 border-black mt-4 overflow-hidden">
                  <div id="eco-progress-bar" class="bg-lime-300 h-full" style="width: 0%"></div>
                </div>
                <p class="text-xs font-bold mt-2" id="eco-xp-text">0 / 500 XP</p>
              </div>
              <div class="grid grid-cols-2 gap-4 mt-8">
                <div class="nb-card p-4 bg-lime-300">
                  <p class="text-xs font-bold uppercase">Total Points</p>
                  <p class="text-2xl font-black text-lime-900" id="eco-total-points">0</p>
                </div>
                <div class="nb-card p-4 bg-cyan-300">
                  <p class="text-xs font-bold uppercase">CO2 Saved</p>
                  <p class="text-2xl font-black text-cyan-900" id="eco-carbon-saved">0 kg</p>
                </div>
              </div>
            </div>
          </div>

          <!-- Tab Wishlist -->
          <div id="content-wishlist" class="nb-card p-6 bg-white hidden">
            <h3 class="text-3xl font-black uppercase mb-6">Wishlist Saya</h3>
            <div id="profile-wishlist-container" class="grid grid-cols-1 md:grid-cols-2 gap-4">
              <p class="text-center font-bold py-8">Memuat wishlist...</p>
            </div>
          </div>

        </div>
      </div>
    </main>

    <footer class="nb-footer">
      <div class="max-w-7xl mx-auto px-4 py-8 text-center font-bold uppercase">
        © 2026 ECOSTORE — ALL RIGHTS RESERVED
      </div>
    </footer>

    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/profile.js"></script>
  </body>
</html>
