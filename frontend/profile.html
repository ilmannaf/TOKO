<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profil Saya - EcoStore</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50">
  
  <header class="bg-white shadow-sm sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
      <a href="index.html" class="text-2xl font-bold text-indigo-600">ECOSTORE</a>
      <div class="flex gap-4 items-center">
        <a href="toko.html" class="text-gray-700 hover:text-indigo-600">Produk</a>
        <a href="keranjang.html" class="relative text-gray-700 hover:text-indigo-600">
          <i class="fas fa-shopping-cart text-xl"></i>
          <span id="cart-count" class="absolute -top-2 -right-2 bg-red-500 text-white text-xs font-bold rounded-full h-5 w-5 flex items-center justify-center hidden">0</span>
        </a>
        <button onclick="logout()" class="bg-red-600 text-white px-4 py-2 rounded hover:bg-red-700 font-semibold transition">
          Logout
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-16">
    <div class="grid md:grid-cols-3 gap-8">
      
      <!-- Sidebar Profil -->
      <div class="md:col-span-1">
        <div class="bg-white rounded-xl shadow-sm p-6">
          <div class="text-center mb-6">
            <div class="w-24 h-24 bg-indigo-100 rounded-full mx-auto mb-4 flex items-center justify-center">
              <i class="fas fa-user text-indigo-600 text-4xl"></i>
            </div>
            <h2 id="user-name" class="text-xl font-bold text-gray-900">Loading...</h2>
            <p id="user-email" class="text-sm text-gray-500 mt-1">Loading...</p>
          </div>
          
          <div class="border-t pt-4">
            <button onclick="showTab('orders')" id="tab-orders" class="w-full text-left px-4 py-3 rounded-lg font-medium bg-indigo-50 text-indigo-600 mb-2">
              <i class="fas fa-shopping-bag mr-2"></i> Pesanan Saya
            </button>
            <button onclick="showTab('wishlist')" id="tab-wishlist" class="w-full text-left px-4 py-3 rounded-lg font-medium text-gray-600 hover:bg-gray-50 mb-2">
              <i class="fas fa-heart mr-2"></i> Wishlist
            </button>
            <button onclick="showTab('profile')" id="tab-profile" class="w-full text-left px-4 py-3 rounded-lg font-medium text-gray-600 hover:bg-gray-50 mb-2">
              <i class="fas fa-user-edit mr-2"></i> Edit Profil
            </button>
            <button onclick="showTab('ecopoints')" id="tab-ecopoints" class="w-full text-left px-4 py-3 rounded-lg font-medium text-gray-600 hover:bg-gray-50">
              <i class="fas fa-leaf mr-2"></i> Eco-Points
            </button>
          </div>
        </div>
      </div>

      <!-- Content Area -->
      <div class="md:col-span-2">
        
        <!-- Tab Pesanan -->
        <div id="content-orders" class="bg-white rounded-xl shadow-sm p-6">
          <h3 class="text-2xl font-bold text-gray-900 mb-6">Riwayat Pesanan</h3>
          <div id="orders-list" class="space-y-4">
            <p class="text-center text-gray-500 py-8">Memuat pesanan...</p>
          </div>
        </div>

        <!-- Tab Edit Profil -->
        <div id="content-profile" class="bg-white rounded-xl shadow-sm p-6 hidden">
          <h3 class="text-2xl font-bold text-gray-900 mb-6">Edit Profil</h3>
          <form id="profile-form" class="space-y-4">
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2">Nama Lengkap</label>
              <input type="text" id="edit-nama" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent" required>
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2">Email</label>
              <input type="email" id="edit-email" class="w-full px-4 py-2 border border-gray-300 rounded-lg bg-gray-50" disabled>
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2">Nomor Telepon</label>
              <input type="tel" id="edit-telepon" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2">Alamat</label>
              <textarea id="edit-alamat" rows="3" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent"></textarea>
            </div>
            <div class="grid grid-cols-2 gap-4">
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Kota</label>
                <input type="text" id="edit-kota" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Provinsi</label>
                <input type="text" id="edit-provinsi" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
              </div>
            </div>
            <button type="submit" class="w-full bg-indigo-600 text-white py-3 rounded-lg font-semibold hover:bg-indigo-700 transition-colors">
              Simpan Perubahan
            </button>
          </form>
        </div>

        <!-- Tab Eco-Points -->
        <div id="content-ecopoints" class="bg-white rounded-xl shadow-sm p-6 hidden">
          <h3 class="text-2xl font-bold text-gray-900 mb-6">Eco-Points Saya</h3>
          <div class="text-center py-8">
            <div class="text-6xl mb-4" id="eco-tree-emoji">🌱</div>
            <p class="text-xl font-bold text-gray-900 mb-2" id="eco-level-text">Level 1: Tunas Harapan</p>
            <div class="max-w-md mx-auto mb-4">
              <div class="w-full bg-gray-200 rounded-full h-3">
                <div id="eco-progress-bar" class="bg-green-500 h-3 rounded-full transition-all duration-500" style="width: 0%"></div>
              </div>
              <p class="text-sm text-gray-500 mt-2" id="eco-xp-text">0 / 500 XP</p>
            </div>
            <div class="grid grid-cols-2 gap-4 mt-8">
              <div class="bg-green-50 rounded-lg p-4">
                <p class="text-sm text-gray-600">Total Points</p>
                <p class="text-2xl font-bold text-green-600" id="eco-total-points">0</p>
              </div>
              <div class="bg-blue-50 rounded-lg p-4">
                <p class="text-sm text-gray-600">CO2 Saved</p>
                <p class="text-2xl font-bold text-blue-600" id="eco-carbon-saved">0 kg</p>
              </div>
            </div>
          </div>
        </div>

        <!-- Tab Wishlist -->
        <div id="content-wishlist" class="bg-white rounded-xl shadow-sm p-6 hidden">
          <h3 class="text-2xl font-bold text-gray-900 mb-6">Wishlist Saya</h3>
          <div id="profile-wishlist-container" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <p class="text-center text-gray-500 py-8">Memuat wishlist...</p>
          </div>
        </div>

      </div>
    </div>
  </main>

  <footer class="bg-indigo-600 text-white mt-16">
    <div class="max-w-7xl mx-auto px-4 py-8 text-center text-indigo-200 text-sm">
      © 2026 ECOSTORE. All rights reserved.
    </div>
  </footer>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/profile.js"></script>
</body>
</html>
