<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Akun — EcoStore</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/modern.css">
  </head>

  <body class="bg-gray-100 min-h-screen flex items-center justify-center">
    
    <!-- Navbar -->
    <nav class="modern-navbar sticky top-0 z-50">
      <div class="max-w-7xl mx-auto px-4">
        <div class="flex justify-between items-center h-20">
          <div class="text-2xl font-black tracking-tight">
            <a href="index.html">ECO<span class="text-primary px-2">STORE</span></a>
          </div>
          <ul class="hidden md:flex space-x-6 items-center">
            <li><a href="index.html" class="modern-nav-link text-lg">HOME</a></li>
            <li><a href="toko.html" class="modern-nav-link text-lg">PRODUK</a></li>
            <li><a href="contact.html" class="modern-nav-link text-lg">KONTAK</a></li>
            <li><a href="Tracking.html" class="modern-nav-link text-lg">LACAK</a></li>
          </ul>
          <div id="nav-auth"></div>
        </div>
      </div>
    </nav>

  <!-- Form Register -->
  <div class="flex items-center justify-center py-16 px-4">
    <div class="modern-card p-8 w-full max-w-md">

      <a href="index.html" class="text-3xl font-black tracking-tight block text-center mb-6">
        ECO<span class="text-primary px-2">STORE</span>
      </a>

      <h2 class="text-3xl font-black text-center mb-6">Buat Akun Baru</h2>

      <!-- Pesan error / sukses -->
      <div id="error-msg" class="hidden mb-4 modern-alert modern-alert-error"></div>
      <div id="success-msg" class="hidden mb-4 modern-alert modern-alert-success"></div>

      <!-- Nama -->
      <label class="text-sm font-bold mb-2 block tracking-wide">Nama Lengkap</label>
      <input type="text" id="nama" placeholder="Masukkan nama lengkap"
        class="modern-input w-full mb-4">

      <!-- Email -->
      <label class="text-sm font-bold mb-2 block tracking-wide">Email</label>
      <input type="email" id="email" placeholder="Contoh@email.com"
        class="modern-input w-full mb-4">

      <!-- Password -->
      <label class="text-sm font-bold mb-2 block tracking-wide">Password</label>
      <div class="relative mb-2">
        <input type="password" id="password" placeholder="Minimal 6 karakter"
          class="modern-input w-full pr-10 text-sm"
          oninput="checkPasswordStrength(this.value)">
        <button type="button" onclick="togglePassword('password', this)"
          class="absolute right-3 top-1/2 -translate-y-1/2 text-2xl">
          👁
        </button>
      </div>

      <!-- Indikator kekuatan password -->
      <div id="strength-bar" class="modern-progress h-2 mb-1 w-0 transition-all duration-300" style="background:var(--border);"></div>
      <p id="strength-text" class="text-xs font-bold mb-4"></p>

      <!-- Konfirmasi Password -->
      <label class="text-sm font-bold mb-2 block tracking-wide">Konfirmasi Password</label>
      <div class="relative mb-6">
        <input type="password" id="confirm-password" placeholder="Ulangi password"
          class="modern-input w-full pr-10">
        <button type="button" onclick="togglePassword('confirm-password', this)"
          class="absolute right-3 top-1/2 -translate-y-1/2 text-2xl">
          👁
        </button>
      </div>

      <!-- Button Register -->
      <button id="btn-register" onclick="handleRegister()"
        class="modern-btn modern-btn-primary w-full mb-4">
        Daftar Sekarang
      </button>

      <!-- Link ke Login -->
      <p class="text-sm text-center font-bold">
        Sudah punya akun?
        <a href="login.html" class="modern-link">Masuk</a>
      </p>

    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/register.js"></script>
</body>

</html>
