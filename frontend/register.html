<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Akun — EcoStore</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/neobrutalism.css">
  </head>

  <body class="bg-gray-100 min-h-screen flex items-center justify-center">
    
    <!-- Navbar -->
    <nav class="nb-navbar sticky top-0 z-50">
      <div class="max-w-7xl mx-auto px-4">
        <div class="flex justify-between items-center h-20">
          <div class="text-2xl font-black tracking-tight">
            <a href="index.html">ECO<span class="bg-yellow-300 px-2 border-4 border-black">STORE</span></a>
          </div>
          <ul class="hidden md:flex space-x-6 items-center">
            <li><a href="index.html" class="nb-link text-lg">HOME</a></li>
            <li><a href="toko.html" class="nb-link text-lg">PRODUK</a></li>
            <li><a href="contact.html" class="nb-link text-lg">KONTAK</a></li>
            <li><a href="Tracking.html" class="nb-link text-lg">LACAK</a></li>
          </ul>
          <div id="nav-auth"></div>
        </div>
      </div>
    </nav>

  <!-- Form Register -->
  <div class="flex items-center justify-center py-16 px-4">
    <div class="nb-card p-8 w-full max-w-md bg-white">

      <a href="index.html" class="text-3xl font-black tracking-tight block text-center mb-6">
        ECO<span class="bg-yellow-300 px-2 border-4 border-black">STORE</span>
      </a>

      <h2 class="text-3xl font-black text-center uppercase mb-6">Buat Akun Baru</h2>

      <!-- Pesan error / sukses -->
      <div id="error-msg" class="hidden mb-4 nb-alert nb-alert-error"></div>
      <div id="success-msg" class="hidden mb-4 nb-alert nb-alert-success"></div>

      <!-- Nama -->
      <label class="text-sm font-bold uppercase mb-2 block tracking-wide">Nama Lengkap</label>
      <input type="text" id="nama" placeholder="MASUKKAN NAMA LENGKAP"
        class="nb-input w-full mb-4 uppercase">

      <!-- Email -->
      <label class="text-sm font-bold uppercase mb-2 block tracking-wide">Email</label>
      <input type="email" id="email" placeholder="CONTOH@EMAIL.COM"
        class="nb-input w-full mb-4">

      <!-- Password -->
      <label class="text-sm font-bold uppercase mb-2 block tracking-wide">Password</label>
      <div class="relative mb-2">
        <input type="password" id="password" placeholder="MINIMAL 6 KARAKTER"
          class="nb-input w-full pr-10 uppercase"
          oninput="checkPasswordStrength(this.value)">
        <button type="button" onclick="togglePassword('password', this)"
          class="absolute right-3 top-1/2 -translate-y-1/2 text-2xl">
          👁
        </button>
      </div>

      <!-- Indikator kekuatan password -->
      <div id="strength-bar" class="h-2 border-4 border-black mb-1 w-0 transition-all duration-300 bg-yellow-300"></div>
      <p id="strength-text" class="text-xs font-bold mb-4 uppercase"></p>

      <!-- Konfirmasi Password -->
      <label class="text-sm font-bold uppercase mb-2 block tracking-wide">Konfirmasi Password</label>
      <div class="relative mb-6">
        <input type="password" id="confirm-password" placeholder="ULANGI PASSWORD"
          class="nb-input w-full pr-10 uppercase">
        <button type="button" onclick="togglePassword('confirm-password', this)"
          class="absolute right-3 top-1/2 -translate-y-1/2 text-2xl">
          👁
        </button>
      </div>

      <!-- Button Register -->
      <button id="btn-register" onclick="handleRegister()"
        class="nb-btn nb-btn-yellow w-full mb-4">
        DAFTAR SEKARANG
      </button>

      <!-- Link ke Login -->
      <p class="text-sm text-center font-bold uppercase">
        Sudah punya akun?
        <a href="login.html" class="nb-link">Masuk</a>
      </p>

    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/register.js"></script>
</body>

</html>
