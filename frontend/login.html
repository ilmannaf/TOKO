<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 flex items-center justify-center min-h-screen">

  <div class="bg-white p-8 rounded-xl shadow-md w-full max-w-md">

    <h2 class="text-2xl font-bold text-center text-gray-800 mb-6">
      Login ke Akun
    </h2>

    <!-- Username -->
    <input type="text" placeholder="Username"
      class="w-full mb-4 px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">

    <!-- Email -->
    <input type="email" placeholder="Email"
      class="w-full mb-4 px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">

    <!-- Password -->
    <input type="password" placeholder="Password"
      class="w-full mb-4 px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">

    <!-- Button -->
    <button class="w-full bg-indigo-600 text-white py-2 rounded-lg hover:bg-indigo-700">
      Masuk
    </button>

    <!-- Link -->
    <p class="text-sm text-center text-gray-500 mt-4">
      Belum punya akun?
      <a href="#" class="text-indigo-600 hover:underline">Daftar</a>
    </p>

  </div>

</body>
</html>
