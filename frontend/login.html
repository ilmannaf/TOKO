<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — EcoStore</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/modern.css">
  </head>

  <body class="bg-gray-100 min-h-screen flex items-center justify-center">
    
    <!-- Navbar -->
    <nav class="modern-navbar sticky top-0 z-50">
      <div class="max-w-7xl mx-auto px-4">
        <div class="flex justify-between items-center h-20">
          <div class="text-2xl font-black tracking-tight">
            <a href="index.html">ECO<span class="text-primary px-2">STORE</span></a>
          </div>
          <ul class="hidden md:flex space-x-6 items-center">
            <li><a href="index.html" class="modern-nav-link text-lg">HOME</a></li>
            <li><a href="toko.html" class="modern-nav-link text-lg">PRODUK</a></li>
            <li><a href="contact.html" class="modern-nav-link text-lg">KONTAK</a></li>
            <li><a href="Tracking.html" class="modern-nav-link text-lg">LACAK</a></li>
          </ul>
          <div id="nav-auth"></div>
        </div>
      </div>
    </nav>

  <!-- Form Login -->
  <div class="flex items-center justify-center py-16 px-4">
    <div class="modern-card p-8 w-full max-w-md">

      <a href="index.html" class="text-3xl font-black tracking-tight block text-center mb-6">
        ECO<span class="text-primary px-2">STORE</span>
      </a>

      <!-- Tab Pilihan Login -->
      <div class="flex border-4 border-black mb-6">
        <button id="tab-user" onclick="showTab('user')"
          class="flex-1 py-3 font-black uppercase text-sm bg-yellow-300 border-r-2 border-black">
          👤 Pengguna
        </button>
        <button id="tab-admin" onclick="showTab('admin')"
          class="flex-1 py-3 font-black uppercase text-sm bg-white">
          🔐 Admin
        </button>
      </div>

      <!-- Pesan error -->
      <div id="error-msg" class="hidden mb-4 modern-alert modern-alert-error"></div>

      <!-- Form User Login -->
      <div id="form-user">
        <label class="text-sm font-bold mb-2 block tracking-wide">Email</label>
        <input type="email" id="email" placeholder="Contoh@email.com"
          class="modern-input w-full mb-4">

        <label class="text-sm font-bold mb-2 block tracking-wide">Password</label>
        <div class="relative mb-6">
          <input type="password" id="password" placeholder="Masukkan password"
            class="modern-input w-full pr-10">
          <button type="button" onclick="togglePassword('password', this)"
            class="absolute right-3 top-1/2 -translate-y-1/2 text-2xl">👁</button>
        </div>

        <button id="btn-login" onclick="handleLogin()"
          class="modern-btn modern-btn-primary w-full mb-4">
          Masuk
        </button>

        <p class="text-sm text-center font-bold">
          Belum punya akun?
          <a href="register.html" class="modern-link">Daftar</a>
        </p>
      </div>

      <!-- Form Admin Login -->
      <div id="form-admin" class="hidden">
        <label class="text-sm font-bold mb-2 block tracking-wide">Username</label>
        <input type="text" id="admin-username" placeholder="Username admin"
          class="modern-input w-full mb-4">

        <label class="text-sm font-bold mb-2 block tracking-wide">Password</label>
        <div class="relative mb-6">
          <input type="password" id="admin-password" placeholder="Password admin"
            class="modern-input w-full pr-10">
          <button type="button" onclick="togglePassword('admin-password', this)"
            class="absolute right-3 top-1/2 -translate-y-1/2 text-2xl">👁</button>
        </div>

        <button id="btn-admin-login" onclick="handleAdminLogin()"
          class="modern-btn modern-btn-primary w-full mb-4">
          Masuk sebagai Admin
        </button>
      </div>

    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
