<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — EcoStore</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style> body { font-family: "Poppins", sans-serif; } </style>
</head>

<body class="bg-gray-100 min-h-screen">

  <!-- Navbar -->
  <nav class="bg-white shadow sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4">
      <div class="flex justify-between items-center h-16">
        <div class="text-xl font-bold text-indigo-600">
          <a href="index.html">ECOSTORE</a>
        </div>
        <ul class="hidden md:flex space-x-8 items-center">
          <li><a href="index.html" class="text-gray-700 hover:text-indigo-600">Home</a></li>
          <li><a href="toko.html" class="text-gray-700 hover:text-indigo-600">Produk</a></li>
          <li><a href="contact.html" class="text-gray-700 hover:text-indigo-600">Kontak</a></li>
        </ul>
        <!-- Slot nama user / tombol login -->
        <div id="nav-auth"></div>
      </div>
    </div>
  </nav>
  <!-- End Navbar -->

  <!-- Form Login -->
  <div class="flex items-center justify-center py-16 px-4">
    <div class="bg-white p-8 rounded-xl shadow-md w-full max-w-md">

      <a href="index.html" class="text-2xl font-bold text-indigo-600 tracking-wider block text-center mb-6">
        ECO<span class="text-gray-900">STORE</span>
      </a>

      <h2 class="text-2xl font-bold text-center text-gray-800 mb-6">Login ke Akun</h2>

      <!-- Pesan error -->
      <div id="error-msg" class="hidden mb-4 bg-red-50 border border-red-200 text-red-600 text-sm px-4 py-3 rounded-lg"></div>

      <!-- Email -->
      <label class="text-sm font-medium text-gray-700 mb-1 block">Email</label>
      <input type="email" id="email" placeholder="contoh@email.com"
        class="w-full mb-4 px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">

      <!-- Password -->
      <label class="text-sm font-medium text-gray-700 mb-1 block">Password</label>
      <div class="relative mb-6">
        <input type="password" id="password" placeholder="Masukkan password"
          class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none pr-10">
        <!-- Toggle show/hide password -->
        <button type="button" onclick="togglePassword('password', this)"
          class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 text-xs">
          👁
        </button>
      </div>

      <!-- Button Login -->
      <button id="btn-login" onclick="handleLogin()"
        class="w-full bg-indigo-600 text-white py-2.5 rounded-lg hover:bg-indigo-700 font-medium transition-colors">
        Masuk
      </button>

      <!-- Link ke Register -->
      <p class="text-sm text-center text-gray-500 mt-4">
        Belum punya akun?
        <a href="register.html" class="text-indigo-600 hover:underline font-medium">Daftar</a>
      </p>

    </div>
  </div>

  <script src="../backend/auth.js"></script>
  <script>
    // Jika sudah login, langsung redirect
    redirectIfLoggedIn();

    // Toggle show/hide password
    function togglePassword(inputId, btn) {
      const input = document.getElementById(inputId);
      if (input.type === 'password') {
        input.type = 'text';
        btn.textContent = '🙈';
      } else {
        input.type = 'password';
        btn.textContent = '👁';
      }
    }

    async function handleLogin() {
      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const errorMsg = document.getElementById('error-msg');
      const btn      = document.getElementById('btn-login');

      // Reset error
      errorMsg.classList.add('hidden');

      // Validasi
      if (!email || !password) {
        errorMsg.textContent = 'Email dan password wajib diisi.';
        errorMsg.classList.remove('hidden');
        return;
      }

      // Loading state
      btn.textContent = 'Memproses...';
      btn.disabled = true;

      try {
        const response = await fetch('http://localhost:3000/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password }),
        });

        const data = await response.json();

        if (data.success) {
          // Simpan token & data user ke localStorage
          localStorage.setItem('token', data.token);
          localStorage.setItem('user', JSON.stringify(data.user));
          // Redirect ke index
          window.location.href = 'index.html';
        } else {
          errorMsg.textContent = data.message || 'Login gagal.';
          errorMsg.classList.remove('hidden');
        }

      } catch (err) {
        errorMsg.textContent = 'Tidak dapat terhubung ke server. Pastikan backend berjalan.';
        errorMsg.classList.remove('hidden');
      } finally {
        btn.textContent = 'Masuk';
        btn.disabled = false;
      }
    }

    // Tekan Enter untuk login
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') handleLogin();
    });
  </script>

</body>
</html>
