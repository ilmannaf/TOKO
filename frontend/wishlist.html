<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wishlist - EcoStore</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/modern.css">
</head>
<body class="bg-gray-100 min-h-screen">
  
  <header class="modern-navbar sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center h-20">
      <a href="index.html" class="text-2xl font-black tracking-tight">ECO<span class="text-primary px-2">STORE</span></a>
      <div class="flex gap-6 items-center">
        <a href="toko.html" class="modern-nav-link font-black">Produk</a>
        <a href="wishlist.html" class="modern-nav-link font-black active">
          ❤️ Wishlist
        </a>
        <a href="keranjang.html" class="relative text-2xl font-black">
          🛒
          <span id="cart-count" class="modern-cart-badge hidden">0</span>
        </a>
        <a href="profile.html" class="text-2xl">👤</a>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-16">
    <div class="mb-10">
      <h1 class="text-4xl font-black">❤️ Wishlist Saya</h1>
      <p class="font-bold text-sm mt-2">Produk favorit yang ingin kamu beli nanti</p>
    </div>

    <div id="wishlist-container">
      <div class="text-center py-20">
        <div class="modern-card p-8 inline-block mb-4">
          <div class="animate-spin text-4xl">⏳</div>
        </div>
        <p class="font-black mt-4">Memuat wishlist...</p>
      </div>
    </div>
  </main>

  <footer class="modern-footer">
    <div class="max-w-7xl mx-auto px-4 py-8 text-center font-bold uppercase">
      © 2026 ECOSTORE — ALL RIGHTS RESERVED
    </div>
  </footer>

  <!-- Toast -->
  <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 modern-toast px-6 py-4 z-50 opacity-0 translate-y-4 transition-all duration-300 pointer-events-none"></div>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/toko.js"></script>
  <script src="js/wishlist.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      renderWishlistPage();
    });
  </script>
</body>
</html>
