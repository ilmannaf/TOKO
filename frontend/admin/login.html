<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — EcoStore</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../css/neobrutalism.css">
  <style>
    body { background: #f5f5f5; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .login-card { background: #fff; border: 4px solid #000; box-shadow: 12px 12px 0 0 rgba(0,0,0,1); padding: 2.5rem; width: 100%; max-width: 420px; margin: 1rem; }
    .login-card h1 { font-size: 2rem; font-weight: 900; text-transform: uppercase; text-align: center; margin-bottom: 0.5rem; }
    .login-card .subtitle { font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; text-align: center; margin-bottom: 2rem; opacity: 0.6; }
    .login-card label { font-size: 0.8rem; font-weight: 900; text-transform: uppercase; letter-spacing: 0.05em; display: block; margin-bottom: 0.4rem; }
    .login-card .nb-input { width: 100%; margin-bottom: 1.2rem; }
    .login-card .nb-btn { width: 100%; padding: 0.9rem; font-size: 1rem; }
    .login-card .error-msg { background: var(--nb-pink); color: #fff; border: 4px solid #000; padding: 0.75rem 1rem; font-weight: 700; font-size: 0.85rem; display: none; margin-bottom: 1rem; text-align: center; }
    .login-card .back-link { display: block; text-align: center; margin-top: 1.2rem; font-weight: 700; font-size: 0.85rem; color: #000; }
    .login-card .back-link:hover { text-decoration: underline; }
    .lock-icon { font-size: 3rem; text-align: center; margin-bottom: 0.5rem; }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="lock-icon">🔐</div>
    <h1>Admin</h1>
    <p class="subtitle">Panel Management</p>
    <div class="error-msg" id="error-msg"></div>
    <form id="login-form">
      <label>Username</label>
      <input type="text" id="username" class="nb-input" placeholder="Masukkan username" autocomplete="off" required>
      <label>Password</label>
      <input type="password" id="password" class="nb-input" placeholder="Masukkan password" required>
      <button type="submit" class="nb-btn nb-btn-yellow uppercase font-black">MASUK</button>
    </form>
    <a href="../index.html" class="back-link">← Kembali ke Beranda</a>
  </div>
  <script>
    const BASE_URL = 'http://localhost:3000';

    document.getElementById('login-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const errorEl = document.getElementById('error-msg');
      const btn = this.querySelector('button[type="submit"]');

      if (!username || !password) {
        errorEl.textContent = 'Username dan password wajib diisi.';
        errorEl.style.display = 'block';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Memproses...';

      try {
        const res = await fetch(BASE_URL + '/api/auth/admin-login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();

        if (data.success) {
          localStorage.setItem('admin_token', data.token);
          localStorage.setItem('admin_user', JSON.stringify(data.admin));
          window.location.href = 'index.html';
        } else {
          errorEl.textContent = data.message || 'Username atau password salah.';
          errorEl.style.display = 'block';
          btn.disabled = false;
          btn.textContent = 'MASUK';
        }
      } catch (err) {
        errorEl.textContent = 'Gagal terhubung ke server. Pastikan server berjalan.';
        errorEl.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'MASUK';
      }
    });
  </script>
</body>
</html>
